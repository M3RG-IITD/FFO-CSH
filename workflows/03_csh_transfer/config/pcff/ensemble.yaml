# Defintion of ensemble input to lammps

em:
  variables:
    - temperature
  command:
    "thermo   10\nmin_style   cg\nminimize   1e-10 1e-10 10000 10000"

nvt:
  variables: 
    - temperature
  command:
    fix int_nvt all nvt temp ${temperature} ${temperature} $(100.0*v_timestep) 

nvtemc:
  variables: 
    - temperature
  command:
    "fix temp all langevin ${temperature} ${temperature} $(100.0*v_timestep) ${seed}\nfix	int all nve"

npt:
  variables: 
    - temperature
    - pressure
  command:
    fix int_npt all npt temp ${temperature} ${temperature} $(100.0*v_timestep) tri ${pressure} ${pressure} $(1000.0*v_timestep)

npt_iso:
  variables: 
    - temperature
    - pressure
  command:
    fix int_npt all npt temp ${temperature} ${temperature} $(100.0*v_timestep) iso ${pressure} ${pressure} $(1000.0*v_timestep)
